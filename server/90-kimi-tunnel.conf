Match User kimi-tunnel
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowAgentForwarding no
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitListen 127.0.0.1:58628 127.0.0.1:58630
    PermitTunnel no
    PermitTTY no
    X11Forwarding no
    MaxSessions 0

Match all
