name: RemoteEverything

options:
  bundleIdPrefix: com.remoteeverything
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "3.4.1"
    CURRENT_PROJECT_VERSION: "27"

targets:
  RemoteEverything:
    type: application
    platform: iOS
    sources:
      - path: RemoteEverything
        excludes:
          - Resources/Info.plist
    info:
      path: RemoteEverything/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remoteeverything.app
        PRODUCT_NAME: RemoteEverything
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - RemoteEverythingTests

  RemoteEverythingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RemoteEverythingTests
    dependencies:
      - target: RemoteEverything
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remoteeverything.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
