<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6f8">
  <title>Remote Everything</title>
  <link rel="icon" href="/web/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/web/style.css">
  <script src="/web/app.js" defer></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-computer" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21h8m-4-5v5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><rect x="7" y="4" width="4" height="6" rx="1"/><rect x="14" y="14" width="4" height="6" rx="1"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6L10 14m0-10H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  </defs></svg>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/web/" aria-label="Remote Everything 首页"><img src="/web/icon.svg" alt="" width="36" height="36"><span>Remote<br>Everything</span></a>
      <div id="sidebar-connected" hidden>
        <div class="sidebar-heading"><span>我的电脑</span><span id="node-count"></span></div>
        <nav id="node-list" aria-label="选择电脑"></nav>
      </div>
      <div class="sidebar-bottom">
        <div id="session-actions" hidden>
          <button class="sidebar-action" id="btn-settings"><svg class="icon"><use href="#i-settings"/></svg>设置</button>
          <button class="sidebar-action" id="btn-lock"><svg class="icon"><use href="#i-lock"/></svg>锁定</button>
        </div>
        <div class="gateway-label"><span id="gateway-host"></span></div>
      </div>
    </aside>
    <main id="main-content">
      <section id="view-pair" class="auth-view" hidden aria-labelledby="pair-title">
        <div class="auth-content">
          <h1 id="pair-title" tabindex="-1">连接你的电脑</h1>
          <form id="form-pair">
            <div class="field"><label for="pair-invitation">邀请链接</label><textarea id="pair-invitation" rows="2" placeholder="粘贴邀请链接" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-describedby="invitation-hint"></textarea><span class="hint" id="invitation-hint">邀请链接只能使用一次。</span></div>
            <div class="field"><label for="pair-devicename">设备名称</label><input id="pair-devicename" maxlength="80" required autocomplete="off" placeholder="例如：我的笔记本"></div>
            <div class="password-fields"><div class="field"><label for="pair-passphrase">解锁密码</label><input type="password" id="pair-passphrase" minlength="6" placeholder="至少 6 位" autocomplete="new-password" required></div><div class="field"><label for="pair-passphrase-confirm">确认密码</label><input type="password" id="pair-passphrase-confirm" minlength="6" placeholder="再次输入" autocomplete="new-password" required></div></div>
            <p class="hint password-hint">仅用于解锁当前浏览器保存的连接。</p>
            <p id="pair-error" class="notice error" role="alert" hidden></p>
            <button type="submit" id="btn-start-pair" class="button primary full">连接电脑<svg class="icon"><use href="#i-arrow"/></svg></button>
          </form>
        </div>
      </section>
      <section id="view-unlock" class="auth-view" hidden aria-labelledby="unlock-title">
        <div class="auth-content compact">
          <h1 id="unlock-title" tabindex="-1">解锁连接</h1>
          <form id="form-unlock"><div class="field"><label for="unlock-passphrase">解锁密码</label><input type="password" id="unlock-passphrase" autocomplete="current-password" placeholder="输入密码" required></div><p id="unlock-error" class="notice error" role="alert" hidden></p><button type="submit" id="btn-unlock" class="button primary full">解锁连接<svg class="icon"><use href="#i-arrow"/></svg></button></form>
          <div class="unlock-footer"><button id="btn-forget" class="text-button">忘记密码？重新配对</button></div>
        </div>
      </section>
      <section id="view-pending" class="auth-view" hidden aria-labelledby="pending-title">
        <div class="auth-content compact">
          <h1 id="pending-title" tabindex="-1">等待批准</h1><p class="intro">请管理员确认下面的设备。通过后会自动进入。</p>
          <dl class="details-list"><div><dt>设备名称</dt><dd id="pending-devicename"></dd></div><div><dt>设备指纹<button id="btn-copy-fp" class="text-button">复制</button></dt><dd><code id="pending-fingerprint"></code></dd></div></dl>
          <p id="pending-status" class="pending-status" role="status"><span class="spinner"></span>正在等待确认…</p>
          <p id="pending-error" class="notice error" role="alert" hidden></p>
          <button id="btn-cancel-pending" class="button secondary full">取消连接</button>
        </div>
      </section>
      <section id="view-dashboard" class="workspace" hidden aria-labelledby="current-node-name">
        <header class="workspace-header"><div class="breadcrumb">我的电脑<svg class="icon"><use href="#i-arrow"/></svg><span id="breadcrumb-node"></span></div><button id="btn-refresh-apps" class="button quiet"><svg class="icon"><use href="#i-refresh"/></svg><span>刷新</span></button></header>
        <div class="workspace-content">
          <div class="computer-heading"><div class="computer-icon"><svg class="icon"><use href="#i-computer"/></svg></div><div class="computer-info"><h1 id="current-node-name" tabindex="-1">我的电脑</h1><div class="connection-line"><span id="current-node-badge" class="status" data-tone="neutral">正在连接</span><span id="current-node-meta"></span></div></div></div>
          <div class="apps-toolbar"><div class="section-title"><h2>应用</h2><span id="app-count" class="count">—</span></div><label class="search"><svg class="icon"><use href="#i-search"/></svg><input type="search" id="app-search" placeholder="搜索应用" aria-label="搜索应用" autocomplete="off"><kbd>/</kbd></label></div>
          <p id="dashboard-error" class="notice error" role="alert" hidden></p>
          <div id="apps-loading" class="loading-state" role="status" hidden><span class="spinner"></span>正在读取应用…</div>
          <div id="apps-list" class="apps-list" aria-label="应用列表"></div>
          <div id="empty-apps" class="empty-state" hidden><h3 id="empty-title"></h3><p id="empty-description"></p><button id="btn-retry" class="button secondary" hidden>重试</button></div>
          <footer class="workspace-footer"><span id="last-updated" role="status"></span></footer>
        </div>
      </section>
      <noscript><p class="notice">请启用浏览器的 JavaScript 后使用 Remote Everything。</p></noscript>
    </main>
  </div>
  <dialog id="modal-settings" aria-labelledby="settings-title"><div class="dialog-header"><h2 id="settings-title">设置</h2><button id="btn-close-settings" class="icon-button" aria-label="关闭设置"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="dialog-body"><dl class="details-list"><div><dt>当前设备</dt><dd id="settings-device"></dd></div><div><dt>网关地址</dt><dd id="settings-origin"></dd></div><div><dt>连接有效期</dt><dd id="settings-expires"></dd></div></dl><div class="setting-row"><label for="theme-select">外观</label><select id="theme-select"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="disconnect-section"><button id="btn-logout" class="button danger">退出连接</button></div></div></dialog>
  <dialog id="modal-confirm" aria-labelledby="confirm-title" aria-describedby="confirm-description"><div class="dialog-header"><h2 id="confirm-title"></h2></div><div class="dialog-body"><p id="confirm-description"></p></div><div class="dialog-actions"><button id="confirm-cancel" class="button secondary">取消</button><button id="confirm-accept" class="button danger"></button></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
