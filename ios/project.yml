name: AgentRemote
options:
  bundleIdPrefix: com.agentremote
  deploymentTarget:
    iOS: "16.0"
targets:
  AgentRemote:
    type: application
    platform: iOS
    sources:
      - path: AgentRemote
        excludes:
          - Info.plist
    resources:
      - path: AgentRemote/bootstrap-client.p12
    info:
      path: AgentRemote/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentremote.app
        PRODUCT_NAME: AgentRemote
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
