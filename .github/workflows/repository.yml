name: Repository

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'clients/android/release-signer.sha256'
      - '.github/workflows/nodes.yml'
      - '.github/workflows/release.yml'
      - 'internal/**'
      - 'server/**'
      - 'nodes/**'
      - 'clients/validate_versions.py'
      - 'clients/release.json'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/repository.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'clients/android/release-signer.sha256'
      - '.github/workflows/nodes.yml'
      - '.github/workflows/release.yml'
      - 'internal/**'
      - 'server/**'
      - 'nodes/**'
      - 'clients/validate_versions.py'
      - 'clients/release.json'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/repository.yml'

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files and private keys
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(p12|pfx|jks|keystore|key|key\.pem)$|(^|/)AGENTS\.local\.md$|(^|/)local\.properties$'; then
            echo "::error::credential or local configuration file is tracked"
            exit 1
          fi

  agent-assets:
    name: Agent assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Skills, runtime records, and deployment scripts
        run: |
          python -m unittest \
            skills/remote-everything-install/scripts/test_runtime.py \
            skills/remote-everything-install/scripts/test_render.py \
            skills/remote-everything-install/scripts/test_validate_deployment.py \
            skills/remote-everything-install/scripts/test_inspect_443.py
          python skills/remote-everything-install/scripts/runtime.py validate skills/remote-everything-install/assets/runtime.minimal.json
          python skills/remote-everything-install/scripts/runtime.py validate skills/remote-everything-install/assets/runtime.full.json
          python scripts/cloud/frps-healthcheck/test_healthcheck.py
          python - <<'PY'
          from pathlib import Path
          for path in Path("skills").rglob("*.py"):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

  windows-maintenance:
    name: Windows maintenance scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check recovery isolation and release gates
        shell: pwsh
        run: ./scripts/tests/test-maintenance.ps1

  go-quality:
    name: Go static and vulnerability analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Analyze
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/staticcheck" ./...
          "$(go env GOPATH)/bin/govulncheck" ./...
          credential_pattern='BEGIN ([A-Z ]+ )?PRIVATE KEY|REMOTE_EVERYTHING_PAIRING_''PASSWORD|(pass''word|to''ken|se''cret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_+/-]{24,}'
          if git grep -niE -- "$credential_pattern" -- ':!**/*_test.go' ':!clients/android/app/src/test/**'; then
            echo "::error::possible credential material in repository"
            exit 1
          fi
