name: Android

# A workflow of its own so that a HarmonyOS-only or iOS-only change does not
# build an Android application, and the other way around.
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'clients/android/**'
      - 'clients/release.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'clients/android/**'
      - 'clients/release.json'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android test, lint, and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # The Gradle build cache and the configuration cache, kept between runs:
      # a build that changed one file should not recompile the world.
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Test, lint, and assemble
        working-directory: clients/android
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Reject packaged deployment credentials
        working-directory: clients/android
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          if unzip -l "$apk" | grep -Ei '\.p12$|remote-everything\.properties$'; then
            echo "::error::deployment credential packaged in universal client"
            exit 1
          fi
