name: Clients

# Shared contracts, host regressions and HarmonyOS source checks need no native SDK.
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - 'internal/webclient/**'
      - '.github/workflows/clients.yml'
  pull_request:
    paths:
      - 'clients/**'
      - 'internal/webclient/**'
      - '.github/workflows/clients.yml'

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  behavior:
    name: Client action and browser regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/behavior/package-lock.json
      - name: Install test dependencies
        working-directory: clients/behavior
        run: npm ci
      - name: Install the test browser
        working-directory: clients/behavior
        run: npx playwright install --with-deps chromium
      - name: Run production controller and browser action chains
        working-directory: clients/behavior
        env:
          BROWSER_CHANNEL: chromium
          WEB_TEST_OUTPUT: ${{ runner.temp }}/web-client-regressions
        run: npm test

  versions:
    name: Client version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify three-client version alignment
        run: python clients/validate_versions.py

  harmony:
    name: HarmonyOS source and project gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit functional source requirements
        run: python clients/harmony/audit_source.py
      - name: Validate project manifests
        run: |
          python -m json.tool clients/harmony/AppScope/app.json5 > /dev/null
          python -m json.tool clients/harmony/build-profile.json5 > /dev/null
          python -m json.tool clients/harmony/hvigor/hvigor-config.json5 > /dev/null
          python -m json.tool clients/harmony/oh-package.json5 > /dev/null
          python -m json.tool clients/harmony/entry/oh-package.json5 > /dev/null
          python -m json.tool clients/harmony/entry/src/main/module.json5 > /dev/null
          python -m json.tool clients/harmony/entry/src/main/resources/base/profile/main_pages.json > /dev/null
