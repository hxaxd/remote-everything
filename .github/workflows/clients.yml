name: Clients

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Test, lint, and assemble debug APK
        working-directory: clients/android
        run: |
          bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Ei '\.p12$|remote-everything\.properties$'; then
            echo "::error::deployment credential packaged in universal client"
            exit 1
          fi
