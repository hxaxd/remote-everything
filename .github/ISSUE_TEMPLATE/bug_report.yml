name: Bug report / 缺陷报告
description: Report a reproducible problem without secrets or private deployment data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing Issues first. Security vulnerabilities must use the private reporting link, not this form.
        感谢反馈。请先搜索已有议题；安全漏洞必须使用私密报告入口。
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Release tag and client build number if applicable.
      placeholder: v3.4.1, build 27
    validations:
      required: true
  - type: checkboxes
    id: components
    attributes:
      label: Affected components / 受影响组件
      options:
        - label: Android client
        - label: iOS client
        - label: HarmonyOS client
        - label: Windows node
        - label: Linux node
        - label: macOS node
        - label: LAN server
        - label: Public gateway / FRP / reverse proxy
        - label: Skills, documentation, or release workflow
    validations:
      required: true
  - type: dropdown
    id: topology
    attributes:
      label: Topology / 拓扑
      options:
        - LAN or overlay network
        - Public gateway
        - Local build or CI only
        - Not sure / 不确定
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened / 发生了什么
      description: Describe the earliest visible failure and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics / 已脱敏诊断
      description: Include validation/inspection summaries and the first failing layer. Never paste keys, PKCS#12, invitation URIs, tokens, or full runtime directories.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context / 补充信息
      description: Screenshots must also be redacted.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations / 确认
      options:
        - label: I searched existing Issues. / 我已搜索已有议题。
          required: true
        - label: This is not a security vulnerability. / 这不是安全漏洞。
          required: true
        - label: I removed credentials and private deployment data. / 我已删除凭据和私有部署信息。
          required: true
        - label: I agree to follow the Code of Conduct. / 我同意遵守行为准则。
          required: true
